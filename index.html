<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Exámenes - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-secondary {
            background: #00b894;
        }
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 SISTEMA DE EXÁMENES</h1>
        
        <div class="card">
            <h2>🔐 INICIAR SESIÓN</h2>
            
            <input type="email" id="correo" placeholder="Correo electrónico" value="admin@test.com">
            
            <button onclick="login()">ENTRAR</button>
            <button class="btn-secondary" onclick="insertarDatosPrueba()">📥 INSERTAR DATOS DE PRUEBA</button>
            
            <div class="info-box">
                <strong>📌 USUARIOS DEMO:</strong><br>
                admin@test.com (Administrador)<br>
                docente@test.com (Docente)<br>
                alumno@test.com (Alumno)
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, query, where, getDoc } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQcATGJPrVAgtGOdDnLf_-dwnStm63fJ8",
            authDomain: "programacion-wed-16af8.firebaseapp.com",
            projectId: "programacion-wed-16af8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.login = async function() {
            const correo = document.getElementById("correo").value;
            console.log("Intentando login con:", correo);
            
            // Función auxiliar para buscar en una subcolección
            async function buscarEnSubcoleccion(coleccionDoc, subcoleccion, correo) {
                const ref = collection(db, "panel", coleccionDoc, subcoleccion);
                const q = query(ref, where("correo", "==", correo));
                const snapshot = await getDocs(q);
                if (!snapshot.empty) {
                    const docSnap = snapshot.docs[0];
                    return { id: docSnap.id, ...docSnap.data() };
                }
                return null;
            }
            
            // Buscar en administrador/usuarios
            let usuario = await buscarEnSubcoleccion("administrador", "usuarios", correo);
            if (usuario) {
                usuario.rol = "admin";
                sessionStorage.setItem('usuarioActual', JSON.stringify(usuario));
                window.location.href = 'menu.html';
                return;
            }
            
            // Buscar en docentes/maestros
            usuario = await buscarEnSubcoleccion("docentes", "maestros", correo);
            if (usuario) {
                usuario.rol = "docente";
                sessionStorage.setItem('usuarioActual', JSON.stringify(usuario));
                window.location.href = 'menu.html';
                return;
            }
            
            // Buscar en alumnos/alumnos
            usuario = await buscarEnSubcoleccion("alumnos", "alumnos", correo);
            if (usuario) {
                usuario.rol = "alumno";
                sessionStorage.setItem('usuarioActual', JSON.stringify(usuario));
                window.location.href = 'menu.html';
                return;
            }
            
            alert("❌ Usuario no encontrado. Asegúrate de insertar los datos de prueba primero.");
        };

        window.insertarDatosPrueba = async function() {
            try {
                console.log("Iniciando inserción de datos de prueba...");
                
                // Verificar/crear estructura panel/administrador/usuarios/admin1
                const adminRef = doc(db, "panel", "administrador", "usuarios", "admin1");
                const adminSnap = await getDoc(adminRef);
                if (!adminSnap.exists()) {
                    await setDoc(adminRef, {
                        nombre: "Admin Principal",
                        correo: "admin@test.com",
                        rol: "admin"
                    });
                    console.log("Admin creado.");
                } else {
                    console.log("Admin ya existe.");
                }
                
                // Verificar/crear estructura panel/docentes/maestros/docente_juan
                const docenteRef = doc(db, "panel", "docentes", "maestros", "docente_juan");
                const docenteSnap = await getDoc(docenteRef);
                if (!docenteSnap.exists()) {
                    await setDoc(docenteRef, {
                        nombre: "Profesor Juan",
                        correo: "docente@test.com",
                        especialidad: "Programación"
                    });
                    console.log("Docente creado.");
                } else {
                    console.log("Docente ya existe.");
                }
                
                // Verificar/crear estructura panel/alumnos/alumnos/alumno_pedro
                const alumnoRef = doc(db, "panel", "alumnos", "alumnos", "alumno_pedro");
                const alumnoSnap = await getDoc(alumnoRef);
                if (!alumnoSnap.exists()) {
                    await setDoc(alumnoRef, {
                        nombre: "Pedro García",
                        correo: "alumno@test.com",
                        grado: "3er año"
                    });
                    console.log("Alumno creado.");
                } else {
                    console.log("Alumno ya existe.");
                }
                
                alert("✅ Datos de prueba insertados correctamente.");
            } catch (error) {
                console.error("Error al insertar datos:", error);
                alert("❌ Error al insertar datos. Revisa la consola.");
            }
        };
    </script>
</body>
</html>
